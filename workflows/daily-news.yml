name: Daily News Fetch

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news fetch script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/news_fetch.py

      - name: Run article generation script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/article_gen.py

      - name: Commit and push updated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Daily news and article update
          file_pattern: _data/news.json _data/news_history.json _data/seen_urls.json _data/article_topic.txt _posts/*.md
          push_options: --force-with-lease

      - name: Send daily email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python automation/email_send.py

