name: Daily News Fetch

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news fetch script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/news_fetch.py

      - name: Commit and push updated news data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Daily news update
          file_pattern: _data/news.json _data/seen_urls.json
          push_options: --force-with-lease
